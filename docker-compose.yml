services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tarefas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tarefas
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
