name: Build and deploy container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acraula12321
  IMAGE: minha-app
  RG: rg-python-aula
  WEBAPP: webapp-aula12321

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          az acr login --name $ACR_NAME
          docker build \
            -t $ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }} \
            -t $ACR_NAME.azurecr.io/$IMAGE:latest .
          docker push $ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/$IMAGE:latest

      - name: Point Web App at the new image
        run: |
          az webapp config container set -g $RG -n $WEBAPP \
            --container-image-name $ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}
