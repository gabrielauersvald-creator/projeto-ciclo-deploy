name: Build and deploy container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acraula12321
  IMAGE: minha-app
  RG: rg-python-aula
  WEBAPP: webapp-aula12321

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build --registry $ACR_NAME \
            --image $IMAGE:${{ github.sha }} \
            --image $IMAGE:latest .

      - name: Point Web App at the new image
        run: |
          az webapp config container set -g $RG -n $WEBAPP \
            --container-image-name $ACR_NAME.azurecr.io/$IMAGE:${{ github.sha }}
